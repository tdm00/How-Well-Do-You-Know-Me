name: Tests and deploy

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, integration, and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy to droplet
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check droplet secrets
        id: gate
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DROPLET_HOST is not set, skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # The droplet keeps a clone at /opt/know-me. .env and data/ stay on the server.
      # One app container only: SQLite and the live channel live in that process.
      - name: Deploy
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd /opt/know-me
            git pull --ff-only
            docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
